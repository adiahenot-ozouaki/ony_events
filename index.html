<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />

  <!-- Responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- SEO -->
  <title>ONY | Location de mobilier événementiel au Gabon</title>
  <meta
    name="description"
    content="Location de mobilier et équipements événementiels au Gabon : chaises, tables, tentes, couverts, habillages et prestations pour tous vos événements."
  />
  <meta
    name="keywords"
    content="location mobilier Gabon, événementiel Libreville, tables, chaises, tentes, décoration, ONY"
  />
  <meta name="author" content="ONY" />
  <!-- <meta name="theme-color" content="#ffffff" /> -->

  <!-- Robots -->
  <meta name="robots" content="index, follow" />

  <!-- Canonical -->
  <link rel="canonical" href="https://ony.ga/" />

  <!-- Favicon -->
  <link rel="icon" href="/Icon-512B.png" type="image/png" />
  <link rel="apple-touch-icon" href="/Icon-512B.png" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:title" content="ONY | Location de mobilier événementiel" />
  <meta
    property="og:description"
    content="Votre partenaire pour la location de mobilier et d'équipements événementiels au Gabon."
  />
  <meta property="og:image" content="/preview.png" />
  <meta property="og:url" content="https://ony.ga/" />
  <meta property="og:site_name" content="ONY" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ONY" />
  <meta
    name="twitter:description"
    content="Location de mobilier événementiel au Gabon."
  />
  <meta name="twitter:image" content="/preview.png" />

  <!-- Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- La section Réalisations de l'accueil (RealisationsSection.tsx) charge
       3 photos depuis Unsplash : preconnect pour gagner la latence DNS/TLS
       avant que le navigateur ne découvre ces images en scrollant. -->
  <link rel="preconnect" href="https://images.unsplash.com">

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Preload de l'image hero de l'accueil (HeroSection.tsx) : c'est le plus
       gros élément visible au premier chargement (candidat LCP), mais comme
       elle est posée en background-image CSS plutôt qu'en <img>, le
       navigateur ne la découvrirait normalement qu'après avoir parsé le
       CSS. Ce preload la fait démarrer en parallèle, dès le HTML. -->
  <link rel="preload" as="image" href="/images/deco.jpg" fetchpriority="high" />

  <style>
    html,
    body,
    #root {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    /* body {
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    } */
  </style>
</head>

<body>
  <noscript>
    Vous devez activer JavaScript pour utiliser ONY.
  </noscript>

  <div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
